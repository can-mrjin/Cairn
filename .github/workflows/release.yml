name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download DMG from release
        run: |
          curl -L \
            "https://github.com/zepeng-jin/FlowIsland/releases/download/v${VERSION}/FlowIsland.dmg" \
            -o FlowIsland.dmg

      - name: Compute SHA256
        run: echo "SHA256=$(sha256sum FlowIsland.dmg | awk '{print $1}')" >> $GITHUB_ENV

      - name: Clone homebrew-tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/zepeng-jin/homebrew-tap.git" homebrew-tap

      - name: Update Cask formula
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/flowisland.rb <<'CASK_EOF'
          cask "flowisland" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA256_PLACEHOLDER"

            url "https://github.com/zepeng-jin/FlowIsland/releases/download/v#{version}/FlowIsland.dmg"
            name "FlowIsland"
            desc "macOS notch hub for AI coding agents"
            homepage "https://github.com/zepeng-jin/FlowIsland"

            app "FlowIsland.app"

            zap trash: [
              "~/.codeisland",
            ]
          end
          CASK_EOF
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" homebrew-tap/Casks/flowisland.rb
          sed -i "s/SHA256_PLACEHOLDER/${SHA256}/" homebrew-tap/Casks/flowisland.rb
          sed -i 's/^          //' homebrew-tap/Casks/flowisland.rb

      - name: Commit and push to homebrew-tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/flowisland.rb
          git commit -m "Update flowisland to ${VERSION}"
          git push
