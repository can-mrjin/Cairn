name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download DMG from release
        run: |
          curl -L \
            "https://github.com/can-mrjin/Cairn/releases/download/v${VERSION}/Cairn.dmg" \
            -o Cairn.dmg

      - name: Compute SHA256
        run: echo "SHA256=$(sha256sum Cairn.dmg | awk '{print $1}')" >> $GITHUB_ENV

      - name: Clone homebrew-tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/can-mrjin/homebrew-tap.git" homebrew-tap

      - name: Update Cask formula
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/cairn.rb <<'CASK_EOF'
          cask "cairn" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA256_PLACEHOLDER"

            url "https://github.com/can-mrjin/Cairn/releases/download/v#{version}/Cairn.dmg"
            name "Cairn"
            desc "macOS notch hub for AI coding agents"
            homepage "https://github.com/can-mrjin/Cairn"

            app "Cairn.app"

            zap trash: [
              "~/.codeisland",
            ]
          end
          CASK_EOF
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" homebrew-tap/Casks/cairn.rb
          sed -i "s/SHA256_PLACEHOLDER/${SHA256}/" homebrew-tap/Casks/cairn.rb
          sed -i 's/^          //' homebrew-tap/Casks/cairn.rb

      - name: Commit and push to homebrew-tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/cairn.rb
          git commit -m "Update cairn to ${VERSION}"
          git push

  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package Windows release
        shell: pwsh
        run: |
          if (-not (Test-Path "CodeIsland.Windows.sln")) {
            Write-Output "windows/ not present on this tag; skipping."
            exit 0
          }
          dotnet restore CodeIsland.Windows.sln
          dotnet test CodeIsland.Core.Tests/CodeIsland.Core.Tests.csproj -c Release --no-restore
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-release.ps1
      - name: Upload Windows assets to Release
        if: hashFiles('windows/artifacts/*.zip') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release upload $tag `
            windows/artifacts/*.zip `
            windows/artifacts/release-manifest.json `
            --clobber
